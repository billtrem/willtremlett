{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Will Tremlett{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'portfolio/css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="section-{{ current_section|default:'films' }}">

  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="{% url 'films' %}">Will Tremlett</a>

      <nav class="site-nav" aria-label="Primary">
        <a href="{% url 'films' %}"
           class="{% if current_section == 'films' %}active{% endif %}"
           {% if current_section == 'films' %}aria-current="page"{% endif %}>Films</a>

        <a href="{% url 'video' %}"
           class="{% if current_section == 'video' %}active{% endif %}"
           {% if current_section == 'video' %}aria-current="page"{% endif %}>Video</a>

        <a href="{% url 'art' %}"
           class="{% if current_section == 'art' %}active{% endif %}"
           {% if current_section == 'art' %}aria-current="page"{% endif %}>Art</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="site-main-inner">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
